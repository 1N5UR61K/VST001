yaml
name: Build plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            configure: -G "Visual Studio 17 2022" -T ClangCL
          - os: macos-latest
            name: macOS
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: ubuntu-latest
            name: Linux
            configure: ""
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run engine self-test
        if: runner.os != 'Windows'
        run: ./build/render_test .
      - uses: actions/upload-artifact@v4
        with:
          name: BeadsTextures-${{ matrix.name }}
          path: |
            build/plugin/BeadsTextures_artefacts/Release/VST3
            build/plugin/BeadsTextures_artefacts/Release/Standalone
